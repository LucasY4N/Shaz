[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaz-ai"
version = "0.1.0"
description = "Shaz AI - Assistente inteligente com arquitetura hexagonal"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.3",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "google-genai>=2.8",
    "groq>=0.9",
    "speechrecognition>=3.10",
    "pyttsx3>=2.90",
    # pyaudio NÃO está aqui — instale separado (veja README)
    "yt-dlp>=2024.3",
    "youtube-transcript-api>=0.6",
    "rich>=13.7",
    "psutil>=5.9",
    "typer>=0.12",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]
voice = [
    # Instale após o pip install principal — requer wheel pré-compilado no Windows
    # Veja README: pip install pipwin && pipwin install pyaudio
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "repositories*", "providers*", "services*", "integrations*", "infrastructure*", "dashboard*", "tools*", "plugins*"]
