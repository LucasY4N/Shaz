[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaz-ai"
version = "1.0.0"
description = "Shaz AI - Assistente virtual avançada com voz, personalidade, memória e interface desktop"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "pygame>=2.5",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.6",
    "groq>=0.9",
    "google-genai>=2.8",
    "psutil>=5.9",
    "numpy>=1.24",
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]
voice = [
    "TTS",
    "piper-tts",
    "pyaudio",
]
full = [
    "TTS",
    "piper-tts",
    "pyaudio",
    "speechrecognition>=3.10",
    "pyttsx3>=2.90",
]

[project.scripts]
shaz = "shaz.main:main_cli"
shaz-desktop = "shaz.main:main_desktop"
shaz-install = "shaz.main:main_install"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shaz*", "core*", "repositories*", "providers*", "services*", "integrations*", "infrastructure*", "dashboard*", "tools*", "plugins*"]